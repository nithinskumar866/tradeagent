account:
  capital: 100000            # INR
  risk_per_trade_pct: 1.0    # % of capital risked per trade
  max_open_positions: 5
  max_position_pct: 20       # max % of capital in one stock
  max_per_sector: 2

universe:
  watchlist_file: data/watchlists/nifty100.csv
  min_price: 100             # INR
  min_avg_traded_value_cr: 20  # 20-day avg (close*volume) in crore INR
  min_history_bars: 250

data:
  source: yfinance
  history_years: 12
  index_symbol: "^NSEI"
  vix_symbol: "^INDIAVIX"
  refetch_overlap_days: 5
  events_file: data/events.csv   # your event calendar (date,symbol,type,note), synced on every run
  fetch_results_dates: true      # best-effort results dates from Yahoo, refreshed weekly

market_filter:
  ema_fast: 50
  ema_slow: 200
  vix_max: 25                 # above this → no new entries
  vix_spike_pct_5d: 30        # VIX up more than this in 5 days → no new entries
  caution_risk_multiplier: 0.5
  caution_max_positions: 3

entry:
  ema_short: 20
  ema_mid: 50
  ema_long: 200
  ema_long_slope_lookback: 20
  pullback_min_pct: 3
  pullback_max_pct: 12
  pullback_lookback: 20
  touch_tolerance_pct: 1.0    # low within 1% of EMA20 counts as a touch
  touch_lookback: 3
  rsi_period: 14
  rsi_dip_min: 35
  rsi_dip_max: 50
  rsi_dip_lookback: 5
  buy_zone_top_buffer_pct: 0.5
  avoid_results_within_days: 5   # trading days
  pullback_low_lookback: 5       # pullback depth uses the lowest low of the last N bars
  rs_lookback: 63                # relative strength vs Nifty, in bars
  volume_avg_days: 20            # average volume window for bonus scoring
  volume_dryup_days: 4           # "volume dried up" window before day T

stops_targets:
  swing_low_lookback: 5
  stop_buffer_pct: 0.5
  atr_period: 14
  min_stop_atr: 1.0           # stop at least 1 ATR below entry
  max_stop_pct: 8             # skip trade if stop is further than this
  target_r: 2.0
  breakeven_at_r: 1.0
  trend_exit_ema: 50
  time_stop_days: 20
  results_warning_days: 3

costs:                        # approximate Indian delivery charges — verify with your broker
  brokerage_per_order: 20
  stt_pct: 0.1                # buy and sell
  exchange_txn_pct: 0.00297
  sebi_fee_pct: 0.0001
  stamp_duty_buy_pct: 0.015
  gst_pct: 18                 # on brokerage + exchange + SEBI fees
  dp_charge_per_sell: 15.93
  slippage_pct: 0.1           # per side

backtest:
  start_date: "2014-01-01"
  in_sample_end: "2021-12-31" # report in-sample and out-of-sample separately
  initial_capital: 100000

schedule:
  run_time_ist: "18:30"

explainer:                    # v2: optional plain-English explanations from a local Ollama model
  enabled: true               # falls back to the rule-based reasons if Ollama isn't running
  ollama_url: "http://localhost:11434"
  model: "llama3.2:3b"        # any model you have pulled, e.g. llama3.1:8b (better, slower)
